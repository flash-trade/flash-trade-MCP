[package]
name = "flash-cli"
version = "0.5.0"
edition = "2021"
description = "CLI for Flash Trade V2 (MagicBlock Ephemeral Rollup) — REST client with local signing and two-chain routing"

[[bin]]
name = "flash"
path = "src/main.rs"

[dependencies]
# V2-only: the hosted REST API builds unsigned transactions; solana-sdk/client
# are kept ONLY for local signing + submission. The private flash-sdk git dep,
# anchor-lang, and the account decoders are gone.
solana-sdk = "2.2"
solana-client = "2.2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
bincode = "1"
thiserror = "2"
anyhow = "1"
dirs = "6"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[dev-dependencies]
tempfile = "3"
